services:
  strapi:
    build: .
    container_name: strapi-app
    restart: unless-stopped
    ports:
      - "1337:1337"  # Исправлено: теперь 1337:1337
    environment:
      PROTOCOL: ${PROTOCOL:-http}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-1337}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      DATABASE_CLIENT: ${DATABASE_CLIENT:-postgres}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      
      UNISENDER_API_KEY: ${UNISENDER_API_KEY}
      UNISENDER_SENDER_NAME: ${UNISENDER_SENDER_NAME}
      UNISENDER_SENDER_EMAIL: ${UNISENDER_SENDER_EMAIL}
      UNISENDER_LIST_ID: ${UNISENDER_LIST_ID}
      UNISENDER_ADMIN_EMAIL: ${UNISENDER_ADMIN_EMAIL}
      
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - strapi-network
    command: sh -c "HOST=0.0.0.0 npm run start"  # Добавлено: команда запуска

  postgres:
    image: postgres:17-alpine
    container_name: strapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:${DATABASE_PORT:-5432}"
    networks:
      - strapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  strapi-network:
    driver: bridge